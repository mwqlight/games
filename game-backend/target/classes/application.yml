spring:
  application:
    name: game-backend
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
  ai:
    alibaba:
      dashscope:
        api-key: ${DASHSCOPE_API_KEY:}
server:
  port: 8080
  servlet:
    context-path: /api